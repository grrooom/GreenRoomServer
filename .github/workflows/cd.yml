name: GreenRoom Deploy 

on:
  workflow_run:
    workflows: ["GreenRoom CI"] # CI workflow 이름
    types:
      - completed
    branches:
      - develop

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}  #ci 성공시에만 deploy 진행
    runs-on: ubuntu-latest
    steps:
      - name: SSH to EC2 and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd greenroom
            sudo docker compose stop server
            sudo docker compose rm -f server
            sudo docker rmi ${{ secrets.DOCKER_HUB_USERNAME }}/greenroom
            sudo docker compose up -d --no-deps server