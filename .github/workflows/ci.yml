name: GreenRoom CI

on:
  push:
    branches: [ "develop" ]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # test 용 redis
      redis:
        image: redis:latest
        ports:
          - 6381:6379
        options: --name redis

      # test 용 elasticsearch
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.3.2
        env:
          ELASTIC_PASSWORD: "123456"
          discovery.type: "single-node"
          xpack.security.enabled: "false"
          xpack.security.http.ssl.enabled: "false"
          network.host: "0.0.0.0"
        ports:
          - 9200:9200
        options:
          --health-cmd "curl --silent --fail -u elastic:123456 -k http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name : grant on gradlew
        run : chmod +x ./server/gradlew

      - name: Create Secret Files
        run: |
          RESOURCE_DIR=./server/src/main/resources
          STATIC_DIR=$RESOURCE_DIR/static/.well-known
      
          # application-secret.yml 생성
          mkdir -p $RESOURCE_DIR
          echo "${{ secrets.SECRETS }}" | base64 --decode > $RESOURCE_DIR/application-secret.yml
      
          # fcm-admin.json 생성
          echo "${{ secrets.FCM_SECRET }}" | base64 --decode > $RESOURCE_DIR/fcm-admin.json
        
          # static/.well-known 디렉토리 생성 후 파일 생성
          mkdir -p $STATIC_DIR
          echo "${{ secrets.IOS_FCM_JSON }}" | base64 --decode > $STATIC_DIR/apple-app-site-association
          echo "${{ secrets.ANDROID_FCM_JSON }}" | base64 --decode > $STATIC_DIR/assetlinks.json

      # RestDocs / Swagger 문서 생성
      - name: Generate API Docs (Swagger)
        run: |
          cd server
          ./gradlew copyOasToSwagger 

      - name: Generate API Docs (RestDocs)
        run: |
          cd server
          ./gradlew copyDocument

      # 최종 bootJar 생성 (문서 포함)
      - name: Build BootJar
        run: |
          cd server
          ./gradlew bootJar

      # DockerHub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # Docker 이미지 빌드 후 push
      - name: Build and Push Docker Image
        run: |
          cd server
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/greenroom:latest .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/greenroom:latest
          
