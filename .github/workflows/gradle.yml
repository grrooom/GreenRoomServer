
name: GreenRoom Server CI/CD 
on:
  push:
    branches: [ "develop" ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:latest
        ports:
          - 6381:6379  
        options: --name redis
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.3.2
        env: 
          ELASTIC_PASSWORD: "123456"
          discovery.type: "single-node"
          xpack.security.enabled: "false"
          xpack.security.http.ssl.enabled: "false"
          network.host: "0.0.0.0" 
        ports:
          - 9200:9200
        options: 
          --health-cmd "curl --silent --fail -u elastic:123456 -k http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Make application-secret.yml
      run: |
        cd ./server/src/main/resources # resources 폴더로 이동
        touch ./application-secret.yml # application.yml 생성
        echo "${{ secrets.SECRETS}}" | base64 --decode > ./application-secret.yml
      shell: bash
      
    - name : Make fcm-admin.json 
      run: | 
        cd ./server/src/main/resources # resources 폴더로 이동
        touch ./fcm-admin.json
        echo "${{ secrets.FCM_SECRET}}" | base64 --decode > ./fcm-admin.json

    - name : Make App Device Fcm Secret File
      run : |
        cd ./server/src/main/resources/static
        mkdir -p .well-known
        cd .well-known
        touch ./apple-app-site-association
        echo "${{ secrets.IOS_FCM_JSON}}" | base64 --decode > ./apple-app-site-association
        touch ./assetlinks.json
        echo "${{ secrets.ANDROID_FCM_JSON}}" | base64 --decode > ./assetlinks.json
        
    - name: Wait for Redis to be Ready
      run: |
        echo "Waiting for Redis to start on port 6381..."
        until redis-cli -h localhost -p 6381 ping | grep PONG; do
          echo "Redis is not ready yet. Retrying..."
          sleep 1
        done
        echo "✅ Redis is running on port 6381!"
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name : grant on gradlew
      run : chmod +x ./server/gradlew
      
    - name: Gradle Test And Create API SPEC
      run: |
        cd server
        ./gradlew copyOasToSwagger 
        
    - name: Create Rest Docs
      run: |
        cd server
        ./gradlew copyDocument
        
    - name: BootJar 
      run: |
        cd server
        ./gradlew bootJar
      
      # DockerHub 로그인
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # DockerHub Push
    - name: Build and Push Docker image
      run: |
        cd server
        docker build --cache-from=${{ secrets.DOCKER_HUB_USERNAME }}/greenroom:latest -t ${{ secrets.DOCKER_HUB_USERNAME }}/greenroom:latest .
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/greenroom:latest
 
  deploy:  
    runs-on: ubuntu-latest
    needs: build
    steps:
      # AWS 배포
      - name: SSH to EC2 and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd greenroom
            sudo docker compose stop server
            sudo docker compose rm -f server
            sudo docker rmi ${{ secrets.DOCKER_HUB_USERNAME }}/greenroom
            sudo docker compose up -d --no-deps server
