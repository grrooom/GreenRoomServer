name: GreenRoom PR Test

on:
  pull_request:
    branches: [ "develop" ]
jobs:
  ci-build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write  
      pull-requests: write
    services:
      # test 용 redis
      redis:
        image: redis:latest
        ports:
          - 6381:6379
        options: --name redis

      # test 용 elasticsearch
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.3.2
        env:
          ELASTIC_PASSWORD: "123456"
          discovery.type: "single-node"
          xpack.security.enabled: "false"
          xpack.security.http.ssl.enabled: "false"
          network.host: "0.0.0.0"
        ports:
          - 9200:9200
        options:
          --health-cmd "curl --silent --fail -u elastic:123456 -k http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Secret Files
        run: |
          RESOURCE_DIR=./server/src/main/resources
          STATIC_DIR=$RESOURCE_DIR/static/.well-known
      
          # application-secret.yml 생성
          mkdir -p $RESOURCE_DIR
          echo "${{ secrets.SECRETS }}" | base64 --decode > $RESOURCE_DIR/application-secret.yml
      
          # fcm-admin.json 생성
          echo "${{ secrets.FCM_SECRET }}" | base64 --decode > $RESOURCE_DIR/fcm-admin.json
        
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name : grant on gradlew
        run : chmod +x ./server/gradlew

      # 가상 병합 테스트 실행
      - name: Run tests (generate snippets)
        run: |
          cd server
          ./gradlew clean test

      # 전체 테스트 결과를 PR 코멘트에 요약으로 남김
      - name: Write Test Results
        uses: EnricoMi/publish-unit-test-result-action@v1
        if: always()
        with:
          files: '**/build/test-results/test/TEST-*.xml'

      # 실패한 테스트 결과를 코드에 직접 Check 코멘트로 등록해서 바로 라인 단위에서 피드백
      - name: Write Failure Test Results
        uses: mikepenz/action-junit-report@v3
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          token: ${{ github.token }}
